server:
  address: 0.0.0.0
  port: 8080

spring:
  application:
    name: agro-sale-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/agro-sale-db;AUTO_SERVER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: ${SPRING_H2_CONSOLE_ENABLED:true}
      path: /h2-console

app:
  admin:
    password: admin123
